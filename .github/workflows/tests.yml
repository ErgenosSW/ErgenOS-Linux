name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Archiso profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n build.sh
      - name: Validate profile and package resolution
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm archiso git pacman-contrib sudo xorriso
              useradd -m -u 1001 builder
              printf "builder ALL=(ALL:ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              chown -R builder:builder /work
              sudo -u builder \
                ERGENOS_SKIP_PACKAGE_CHECKS=true \
                ERGENOS_INSTALL_CI_BUILD_DEPS=true \
                ./build.sh --validate-only
            '

