[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# ErgenOS is checked first so first-party packages and updates come from the
# signed project repository by default.
[ergenos]
SigLevel = Required
Server = https://ergenossw.github.io/ErgenOS-Repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
