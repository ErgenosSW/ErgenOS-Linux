---
defaultGroups:
  - wheel
  - audio
  - video
  - storage
  - optical

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
displayAutologin: true
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 128

allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /usr/bin/zsh
  forbidden_names: [ root, ergenos, nobody ]
  home_permissions: "o700"

