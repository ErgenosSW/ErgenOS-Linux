---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 1GiB
  minimumSize: 300MiB
  label: "EFI"

userSwapChoices: [ none, small, suspend, file ]
initialSwapChoice: none
luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs", "f2fs" ]

# Keep kernels and initramfs on ext4. This avoids GRUB limitations when
# reading already-compressed kernel files from a compressed Btrfs root.
# "unknown" makes the root filesystem follow the user's selection above.
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 2GiB
    minSize: 1GiB
    noEncrypt: true
  - name: "rootfs"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
    minSize: 20GiB
    noEncrypt: false
