---
dontChroot: false
timeout: 180
verbose: true
script:
  # initcpiocfg rewrites mkinitcpio.conf, so Snapper must add its overlayfs
  # hook afterwards and before Calamares generates the installed initramfs.
  - "/usr/local/lib/ergenos/setup-snapper"
  - "rm -f /usr/local/lib/ergenos/setup-snapper"
