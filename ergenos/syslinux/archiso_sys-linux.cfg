LABEL ergenos
TEXT HELP
Boot the ErgenOS live medium on BIOS.
It allows you to install ErgenOS or perform system maintenance.
ENDTEXT
MENU LABEL ErgenOS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL ergenosspeech
TEXT HELP
Boot the ErgenOS live medium on BIOS with speakup screen reader.
It allows you to install ErgenOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL ErgenOS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
